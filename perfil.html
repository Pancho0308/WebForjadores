<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil · Forjadores Hispanos VR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <!-- HERO -->
  <div class="page-hero">
    <div class="page-hero-circulo c1"></div>
    <div class="page-hero-circulo c2"></div>
    <div class="container">
      <p class="page-hero-breadcrumb">
        <a href="index.html">Inicio</a> → Mi Perfil
      </p>
      <h1 class="page-hero-titulo">Mi <span>Perfil</span></h1>
    </div>
  </div>

  <!-- CONTENIDO — cambia según si está loggeado o no -->
  <section id="perfil-seccion">
    <div class="container">

      <!-- Estado: no loggeado -->
      <div id="perfil-login" class="perfil-estado">
        <div class="perfil-login-box">
          <div class="perfil-login-icono">🔐</div>
          <h2 class="perfil-login-titulo">Inicia sesión con Discord</h2>
          <p class="perfil-login-desc">
            Conecta tu cuenta de Discord para ver tu perfil, 
            tu rol en la comunidad y más.
          </p>
          <button class="btn-discord" id="btn-login-discord">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.036.055a19.926 19.926 0 0 0 5.993 3.03.077.077 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
            </svg>
            Iniciar sesión con Discord
          </button>
        </div>
      </div>

      <!-- Estado: loggeado -->
      <div id="perfil-usuario" class="perfil-estado" style="display:none;">
        <div class="perfil-card">

          <div class="perfil-header">
            <img id="perfil-avatar" src="" alt="Avatar" class="perfil-avatar-img">
            <div class="perfil-header-info">
              <h2 class="perfil-nombre" id="perfil-nombre">Cargando...</h2>
              <span class="perfil-rol-badge" id="perfil-rol">Miembro</span>
            </div>
            <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
          </div>

          <div class="perfil-body">
            <div class="perfil-info-grid">

              <div class="perfil-info-item">
                <div class="perfil-info-label">Discord ID</div>
                <div class="perfil-info-valor" id="perfil-discord-id">—</div>
              </div>

              <div class="perfil-info-item">
                <div class="perfil-info-label">Miembro desde</div>
                <div class="perfil-info-valor" id="perfil-fecha">—</div>
              </div>

              <div class="perfil-info-item">
                <div class="perfil-info-label">Comunidad</div>
                <div class="perfil-info-valor">Forjadores Hispanos VR</div>
              </div>

            </div>
          </div>

        </div>
      </div>

    </div>
  </section>

  <div id="footer-container"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
