<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Galería · Forjadores Hispanos VR</title>
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <div id="navbar-container"></div>

        <!-- LIGHTBOX -->
        <div id="lightbox" class="lightbox">
            <div class="lightbox-overlay"></div>
            <div class="lightbox-contenido">
                <button class="lightbox-cerrar">✕</button>
                <button class="lightbox-anterior">‹</button>
                <button class="lightbox-siguiente">›</button>
                <img src="" alt="" class="lightbox-img" />
                <p class="lightbox-pie"></p>
            </div>
        </div>

        <!-- HERO -->
        <div class="page-hero" style="text-align: center">
            <div class="page-hero-circulo c1"></div>
            <div class="page-hero-circulo c2"></div>
            <div class="container">
                <p class="page-hero-breadcrumb" style="justify-content: center">
                    <a href="index.html">Inicio</a> → Galería
                </p>
                <h1 class="page-hero-titulo">Nuestra <span>Galería</span></h1>
                <p class="page-hero-desc" style="margin: 0 auto">
                    Momentos especiales, eventos y recuerdos de la comunidad
                    Forjadores Hispanos VR.
                </p>
            </div>
        </div>

        <!-- TABS -->
        <div id="galeria-tabs-section">
            <div class="galeria-tabs-wrap">
                <button class="galeria-tab active" data-categoria="todas">
                    Todas
                </button>
                <button class="galeria-tab" data-categoria="forjaversarios">
                    Forjaversarios
                </button>
                <button class="galeria-tab" data-categoria="eventos">
                    Eventos
                </button>
                <button class="galeria-tab" data-categoria="comunidad">
                    Comunidad
                </button>
                <button class="galeria-tab" data-categoria="arte">
                    Arte & 3D
                </button>
            </div>
        </div>

        <!-- GALERÍA -->
        <section id="galeria-contenido">
            <div class="container">
                <!-- MOSAICO DESTACADO -->
                <div class="galeria-mosaico" id="galeria-mosaico">
                    <div
                        class="gal-foto gal-foto-grande galeria-item"
                        data-categoria="forjaversarios"
                        data-foto="img/galeria/foto1.png"
                        data-pie="Forjaversario 2025"
                    >
                        <img
                            src="../img/galeria/foto1.png"
                            width="1280"
                            height="720"
                            loading="lazy"
                            decoding="async"
                            alt="Forjaversario 2025"
                        />
                        <div class="gal-overlay">
                            <div class="gal-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M11 8.5v5M8.5 11h5"/><path d="M15.8 15.8L20 20"/></svg></div>
                        </div>
                    </div>

                    <div
                        class="gal-foto galeria-item"
                        data-categoria="comunidad"
                        data-foto="img/galeria/foto2.png"
                        data-pie="Uranic"
                    >
                        <img
                            src="../img/galeria/foto2.png"
                            width="1280"
                            height="720"
                            loading="lazy"
                            decoding="async"
                            alt="Uranic"
                        />
                        <div class="gal-overlay">
                            <div class="gal-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M11 8.5v5M8.5 11h5"/><path d="M15.8 15.8L20 20"/></svg></div>
                        </div>
                    </div>

                    <div
                        class="gal-foto galeria-item"
                        data-categoria="eventos"
                        data-foto="img/galeria/foto3.png"
                        data-pie="BaseBall"
                    >
                        <img
                            src="../img/galeria/foto3.png"
                            width="1280"
                            height="720"
                            loading="lazy"
                            decoding="async"
                            alt="BaseBall"
                        />
                        <div class="gal-overlay">
                            <div class="gal-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M11 8.5v5M8.5 11h5"/><path d="M15.8 15.8L20 20"/></svg></div>
                        </div>
                    </div>

                    <div
                        class="gal-foto galeria-item"
                        data-categoria="eventos"
                        data-foto="img/galeria/foto4.png"
                        data-pie="Dia de muertos"
                    >
                        <img
                            src="../img/galeria/foto4.png"
                            width="1280"
                            height="720"
                            loading="lazy"
                            decoding="async"
                            alt="Dia de muertos"
                        />
                        <div class="gal-overlay">
                            <div class="gal-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M11 8.5v5M8.5 11h5"/><path d="M15.8 15.8L20 20"/></svg></div>
                        </div>
                    </div>

                    <div
                        class="gal-foto galeria-item"
                        data-categoria="forjaversarios"
                        data-foto="img/galeria/foto5.png"
                        data-pie="PJKT"
                    >
                        <img
                            src="../img/galeria/foto5.png"
                            width="1280"
                            height="720"
                            loading="lazy"
                            decoding="async"
                            alt="PJKT"
                        />
                        <div class="gal-overlay">
                            <div class="gal-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M11 8.5v5M8.5 11h5"/><path d="M15.8 15.8L20 20"/></svg></div>
                        </div>
                    </div>
                </div>

                <!-- GRID UNIFORME -->
                <!-- Agrega aquí más fotos siguiendo el mismo patrón -->
                <!-- data-categoria puede ser: forjaversarios, eventos, comunidad, arte -->
                <div class="galeria-grid" id="galeria-grid"></div>
                <div id="galeria-vacia" hidden>
                    <div class="galeria-vacia-icono">🖼️</div>
                    <p class="galeria-vacia-titulo">Nada por aquí todavía</p>
                    <p class="galeria-vacia-texto">
                        Aún no hay fotos en esta categoría.
                    </p>
                </div>
            </div>
        </section>

        <div id="google-translate-container" style="display: none"></div>
        <div id="footer-container"></div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            defer
        ></script>
        <script src="../js/componentes.js" defer></script>
        <script src="../js/main.js" defer></script>
        <script src="../js/auth.js" defer></script>
    </body>
</html>
